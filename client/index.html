<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dry Run</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="speedo">
        <span id="ind-left" class="indicator">◀</span>
        <div id="speed">0 mph</div>
        <span id="ind-right" class="indicator">▶</span>
      </div>
      <div id="gear-row">Gear <span id="gear">D</span> · <span id="cam-mode">Driver view</span></div>
      <div id="status">connecting…</div>
    </div>
    <div id="help">
      <b>W/S</b> or <b>↑/↓</b> drive / brake (hold S when stopped to reverse) · <b>A/D</b> steer · <b>Space</b> handbrake<br />
      <b>Z/X</b> indicate left/right · <b>M</b> mirror · <b>Q/E</b> look left/right · <b>C</b> camera · <b>Esc</b> pause · <b>R</b> reset
    </div>
    <div id="bump" hidden>Collision!</div>
    <div id="paused" hidden>PAUSED<small>Press Esc to carry on</small></div>
    <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors</div>
    <script type="module" src="/src/sim/main.ts"></script>
  </body>
</html>
